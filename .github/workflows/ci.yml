name: JC Build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Pillow
        run: python3 -m pip install --quiet pillow

      # Name, icon and settings of the TubePlus edition are applied here, on top of the source code.
      - name: Customize
        run: |
          python3 - <<'PY'
          import re, pathlib

          # ============================================================
          # TubePlus - personnalisation appliquee par-dessus LibreTube.
          # Chaque bloc est independant ; l'ordre compte uniquement quand
          # deux blocs editent le meme fichier (ex: 7 avant 19).
          # Groupes :
          #   Identite      1 2 3        (id, nom, textes)
          #   Icone         4            (logo sur fond blanc)
          #   Mises a jour  5 9          (pas de check amont, updater integre)
          #   Accueil/Nav   6 7 8 19     (feed 1 colonne, barre du bas blanche)
          #   Theme         10 11 16     (noir pur, ecran compte cache, accent)
          #   Lecteur       12 13 14 15  (layout YouTube, suggestions, PiP)
          #   Couleurs      17 18 20     (barres rouges, textes blancs)
          # Audit : les 26 points de controle passent (voir historique chat).
          # ============================================================
          APP_NAME = "DarkTube"
          APP_ID = "com.jcpanel.tubeplus"
          root = pathlib.Path(".")

          def edit(path, fn):
              p = root / path
              old = p.read_text(encoding="utf-8")
              new = fn(old)
              assert new != old, f"no change made in {path}"
              p.write_text(new, encoding="utf-8")

          # 1. application id and name
          def gradle(s):
              s = s.replace('applicationId = "com.github.libretube"', f'applicationId = "{APP_ID}"')
              s = s.replace('resValue("string", "app_name", "LibreTube")', f'resValue("string", "app_name", "{APP_NAME}")')
              s = s.replace('resValue("string", "app_name", "LibreTube Debug")', f'resValue("string", "app_name", "{APP_NAME} Debug")')
              return s
          edit("app/build.gradle.kts", gradle)

          # 2. title shown in the top bar
          edit("app/src/main/java/com/github/libretube/helpers/ThemeHelper.kt",
               lambda s: s.replace("\"Libre<span  style='color:$hexColor';>Tube</span>\"",
                                   "\"Dark<span  style='color:$hexColor';>Tube</span>\""))

          # 3. app name inside the translated texts (the LibreTube sync server keeps its real name)
          count = 0
          for f in sorted((root / "app/src/main/res").glob("values*/strings.xml")):
              lines = f.read_text(encoding="utf-8").split("\n")
              out = []
              for line in lines:
                  if "LibreTube" in line and "sync" not in line.split(">")[0] and 'name="app_name"' not in line:
                      line = re.sub(r"(?<![/\w.-])LibreTube(?![\w/-]|\.\w)", APP_NAME, line)
                      count += 1
                  out.append(line)
              f.write_text("\n".join(out), encoding="utf-8")
          assert count > 0
          print("strings updated:", count)

          # 4. icone DarkTube : tuile noire + cadre rouge visible + triangle play plein rouge
          from PIL import Image, ImageDraw
          res = root / "app/src/main/res"
          def _make_icon(size):
              S = 512
              im = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              dr = ImageDraw.Draw(im)
              red = (235, 20, 25, 255)
              dr.rounded_rectangle([0, 0, S - 1, S - 1], radius=120, fill=(18, 18, 18, 255))
              dr.rounded_rectangle([34, 34, S - 35, S - 35], radius=92, outline=red, width=22)
              dr.polygon([(200, 162), (200, 350), (360, 256)], fill=red)
              return im.resize((size, size), Image.LANCZOS)
          for name, size in {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}.items():
              folder = res / ("mipmap-" + name)
              folder.mkdir(parents=True, exist_ok=True)
              ic = _make_icon(size)
              ic.save(folder / "ic_launcher.png")
              ic.save(folder / "ic_launcher_round.png")
              ic.save(folder / "ic_launcher_foreground.png")
          # retirer l'icone adaptative pour forcer l'image classique
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              p = res / "mipmap-anydpi-v26" / name
              if p.exists():
                  p.unlink()

          # 5. no update check against the upstream project
          edit("app/src/main/java/com/github/libretube/ui/preferences/MainSettings.kt",
               lambda s: s.replace("UpdateChecker(requireContext()).checkUpdate(true)", "Unit"))
          edit("app/src/main/res/xml/settings.xml",
               lambda s: s.replace('app:title="@string/update_summary"', 'app:title="@string/app_name"'))
          edit("app/src/main/res/xml/general_settings.xml",
               lambda s: re.sub(r'\s*<SwitchPreferenceCompat(?:(?!/>).)*?app:key="automatic_update_checks"(?:(?!/>).)*?/>', "", s, flags=re.S))

          # 6. Accueil facon YouTube : feed des tendances en 1 colonne (grande vignette par ligne)
          edit("app/src/main/res/layout/fragment_home.xml",
               lambda s: s.replace('app:spanCount="2"', 'app:spanCount="1"'))

          # 7. Barre du bas facon YouTube : libelles toujours visibles sous les icones
          edit("app/src/main/res/layout/activity_main.xml",
               lambda s: s.replace('app:labelVisibilityMode="selected"', 'app:labelVisibilityMode="labeled"'))

          # 8. logo image en haut a gauche au lieu du texte (facon YouTube)
          edit("app/src/main/java/com/github/libretube/ui/activities/MainActivity.kt",
               lambda s: s.replace(
                   "binding.toolbar.title = ThemeHelper.getStyledAppName(this)",
                   "binding.toolbar.title = null\n        binding.toolbar.logo = androidx.core.content.ContextCompat.getDrawable(this, com.github.libretube.R.mipmap.ic_launcher_foreground)"))

          # 9. mise a jour integree (comme la TV) : popup Installer au demarrage
          import os as _os
          JC_BUILD = _os.environ.get("GITHUB_RUN_NUMBER", "0")
          jc_dir = root / "app/src/main/java/com/github/libretube/jc"
          jc_dir.mkdir(parents=True, exist_ok=True)
          (jc_dir / "JcFileProvider.kt").write_text((root / "jc/JcFileProvider.kt").read_text(encoding="utf-8"), encoding="utf-8")
          (jc_dir / "JcUpdater.kt").write_text((root / "jc/JcUpdater.kt").read_text(encoding="utf-8").replace("__BUILD__", JC_BUILD), encoding="utf-8")
          (res / "xml").mkdir(parents=True, exist_ok=True)
          (res / "xml/jc_file_paths.xml").write_text((root / "jc/jc_file_paths.xml").read_text(encoding="utf-8"), encoding="utf-8")
          edit("app/src/main/java/com/github/libretube/ui/activities/MainActivity.kt",
               lambda s: s.replace("setContentView(binding.root)", "setContentView(binding.root)\n        com.github.libretube.jc.JcUpdater.check(this)", 1))
          def _manifest(s):
              if "REQUEST_INSTALL_PACKAGES" not in s:
                  s = s.replace("<application", '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n\n    <application', 1)
              prov = ('        <provider\n'
                      '            android:name="com.github.libretube.jc.JcFileProvider"\n'
                      '            android:authorities="${applicationId}.jcfileprovider"\n'
                      '            android:exported="false"\n'
                      '            android:grantUriPermissions="true">\n'
                      '            <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/jc_file_paths" />\n'
                      '        </provider>\n    ')
              s = s.replace("</application>", prov + "</application>", 1)
              return s
          edit("app/src/main/AndroidManifest.xml", _manifest)

          # 10. fond noir facon YouTube : theme "pur" (noir pur en mode sombre) active par defaut
          edit("app/src/main/java/com/github/libretube/helpers/ThemeHelper.kt",
               lambda s: s.replace("PreferenceKeys.PURE_THEME,\n            false", "PreferenceKeys.PURE_THEME,\n            true"))
          edit("app/src/main/res/xml/appearance_settings.xml",
               lambda s: s.replace('app:defaultValue="false"\n            app:key="pure_theme"', 'app:defaultValue="true"\n            app:key="pure_theme"'))

          # 11. cacher l'ecran Compte/Synchronisation (source de confusion pour les clients)
          edit("app/src/main/res/xml/settings.xml",
               lambda s: s.replace('    <Preference\n        android:icon="@drawable/ic_server"\n        app:key="account"\n        app:summary="@string/instance_summary"\n        app:title="@string/account" />\n\n', ''))

          # 12. page video facon YouTube : chaine + abonnement au-dessus des boutons, + "...plus" sur la description
          def _reorder_player(s):
              chan_id = s.index('android:id="@+id/player_channel"')
              chan_start = s.rindex('<LinearLayout', 0, chan_id)
              comments = s.index('android:id="@+id/comments_toggle"')
              block_end = s.rindex('</LinearLayout>', 0, comments) + len('</LinearLayout>')
              channel_block = s[chan_start:block_end]
              s2 = s[:chan_start] + s[block_end:]
              a2 = s2.index('<HorizontalScrollView')
              line_start = s2.rindex('\n', 0, a2) + 1
              indent = s2[line_start:a2]
              return s2[:line_start] + channel_block.strip() + "\n\n" + indent + s2[a2:]
          edit("app/src/main/res/layout/fragment_player.xml", _reorder_player)
          edit("app/src/main/java/com/github/libretube/ui/views/DescriptionLayout.kt",
               lambda s: s.replace(
                   "playerViewsInfo.text = context.getString(R.string.normal_views, views, TextUtils.SEPARATOR + date)",
                   "playerViewsInfo.text = context.getString(R.string.normal_views, views, TextUtils.SEPARATOR + date) + \"   ...plus\""))
          # le "...plus" doit survivre au repli/depli (toggleDescription reecrit la ligne)
          edit("app/src/main/java/com/github/libretube/ui/views/DescriptionLayout.kt",
               lambda s: s.replace(
                   'context.getString(R.string.normal_views, streams.views.formatShort(),  TextUtils.SEPARATOR + formattedDate)',
                   'context.getString(R.string.normal_views, streams.views.formatShort(),  TextUtils.SEPARATOR + formattedDate) + "   ...plus"'))
          edit("app/src/main/java/com/github/libretube/ui/views/DescriptionLayout.kt",
               lambda s: s.replace(
                   'context.getString(R.string.normal_views, "%,d".format(streams.views),  TextUtils.SEPARATOR + formattedDate)',
                   'context.getString(R.string.normal_views, "%,d".format(streams.views),  TextUtils.SEPARATOR + formattedDate) + "   ...moins"'))

          # 13. suggestions en colonne (haut->bas) + boutons bulles sombres texte blanc (facon YouTube)
          edit("app/src/main/java/com/github/libretube/ui/fragments/PlayerFragment.kt",
               lambda s: s.replace(
                   "if (resources.configuration.orientation == Configuration.ORIENTATION_PORTRAIT) {\n                LinearLayoutManager.HORIZONTAL\n            } else {\n                LinearLayoutManager.VERTICAL\n            },",
                   "LinearLayoutManager.VERTICAL,"))
          edit("app/src/main/res/values/style.xml",
               lambda s: s.replace(
                   '<item name="android:textColor">?colorPrimary</item>\n        <item name="iconTint">?colorPrimary</item>',
                   '<item name="android:textColor">#FFFFFF</item>\n        <item name="iconTint">#FFFFFF</item>\n        <item name="backgroundTint">#272727</item>'))

          # 14. corrections : suggestions verticales lisibles + Se desabonner / Commentaires non bleus
          # ScrollView simple bride une RecyclerView wrap_content verticale -> NestedScrollView affiche toutes les suggestions
          edit("app/src/main/res/layout/fragment_player.xml", lambda s: s.replace(
              '<ScrollView\n        android:id="@+id/player_scrollView"',
              '<androidx.core.widget.NestedScrollView\n        android:id="@+id/player_scrollView"\n        android:fillViewport="true"').replace(
              '</ScrollView>', '</androidx.core.widget.NestedScrollView>'))
          edit("app/src/main/res/layout/fragment_player.xml", lambda s: s.replace(
              '<androidx.recyclerview.widget.RecyclerView\n                android:id="@+id/related_rec_view"\n                android:layout_width="wrap_content"\n                android:layout_height="wrap_content" />',
              '<androidx.recyclerview.widget.RecyclerView\n                android:id="@+id/related_rec_view"\n                android:layout_width="match_parent"\n                android:layout_height="wrap_content"\n                android:nestedScrollingEnabled="false" />'))
          edit("app/src/main/res/layout/fragment_player.xml", lambda s: s.replace(
              'android:textColor="?colorPrimary"\n                app:drawableEndCompat="@drawable/ic_arrow_up_down"\n                app:drawableTint="?colorPrimary" />',
              'android:textColor="#FFFFFF"\n                app:drawableEndCompat="@drawable/ic_arrow_up_down"\n                app:drawableTint="#FFFFFF" />'))
          edit("app/src/main/res/layout/fragment_player.xml", lambda s: s.replace(
              'android:id="@+id/player_subscribe"\n                    android:layout_width="wrap_content"\n                    android:layout_height="wrap_content"\n                    android:layout_gravity="center"\n                    android:text="@string/subscribe"\n                    android:textSize="12sp" />',
              'android:id="@+id/player_subscribe"\n                    android:layout_width="wrap_content"\n                    android:layout_height="wrap_content"\n                    android:layout_gravity="center"\n                    android:textColor="#FFFFFF"\n                    app:backgroundTint="#272727"\n                    android:text="@string/subscribe"\n                    android:textSize="12sp" />'))
          # nestedScrollingEnabled ne peut PAS etre mis en XML sur NestedScrollView (NPE a l'inflation) -> en Kotlin
          edit("app/src/main/java/com/github/libretube/ui/fragments/PlayerFragment.kt", lambda s: s.replace(
              "        binding.relPlayerSave.setOnClickListener {",
              "        binding.playerScrollView.isNestedScrollingEnabled = false\n        binding.relPlayerSave.setOnClickListener {", 1))

          # 15. clic sur un lien de description : garder la video en PiP (ouvrir le navigateur dans une tache separee)
          edit("app/src/main/java/com/github/libretube/ui/fragments/PlayerFragment.kt", lambda s: s.replace(
              "val intent = Intent(Intent.ACTION_VIEW, uri)\n\n            // start PiP mode if enabled",
              "val intent = Intent(Intent.ACTION_VIEW, uri)\n                .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)\n\n            // start PiP mode if enabled", 1))

          # 16. accent monochrome (blanc) : interface coherente sans bleu (onglets, spinner, liens en blanc)
          edit("app/src/main/java/com/github/libretube/helpers/ThemeHelper.kt", lambda s: s.replace(
              '        var accentColor = PreferenceHelper.getString(PreferenceKeys.ACCENT_COLOR, "")\n        if (accentColor.isEmpty()) {\n            accentColor = if (DynamicColors.isDynamicColorAvailable()) "my" else "blue"\n            PreferenceHelper.putString(PreferenceKeys.ACCENT_COLOR, accentColor)\n        }',
              '        val accentColor = "monochrome"', 1))

          # 17. seule la barre de progression du lecteur en rouge YouTube
          edit("app/src/main/res/layout/exo_styled_player_control_view.xml", lambda s: s.replace(
              'app:played_color="?attr/colorSecondary"\n                app:scrubber_color="?attr/colorSecondary"',
              'app:played_color="#FFFF0000"\n                app:scrubber_color="#FFFF0000"'))

          # 18. barre de reprise (watch progress) sur les miniatures en rouge YouTube
          # la couleur est reappliquee en code (colorPrimaryVariant) -> forcer rouge dans l'extension
          edit("app/src/main/java/com/github/libretube/ui/extensions/SetWatchProgressLength.kt", lambda s: s.replace(
              '    var backgroundColor = ThemeHelper.getThemeColor(\n        context,\n        com.google.android.material.R.attr.colorPrimaryVariant\n    )',
              '    var backgroundColor = Color.RED', 1))

          # 19. onglet du bas selectionne en blanc, sans pastille grise
          open("app/src/main/res/color/jc_nav_tint.xml", "w").write('<?xml version="1.0" encoding="utf-8"?>\n<selector xmlns:android="http://schemas.android.com/apk/res/android">\n    <item android:color="#FFFFFF" android:state_checked="true" />\n    <item android:color="#9E9E9E" />\n</selector>\n')
          edit("app/src/main/res/values/style.xml", lambda s: s.replace(
              '</resources>',
              '    <style name="JcNavIndicator" parent="Widget.Material3.BottomNavigationView.ActiveIndicator">\n        <item name="android:color">@android:color/transparent</item>\n    </style>\n</resources>', 1))
          edit("app/src/main/res/layout/activity_main.xml", lambda s: s.replace(
              'app:menu="@menu/bottom_menu"\n        app:labelVisibilityMode="labeled" />',
              'app:menu="@menu/bottom_menu"\n        app:itemIconTint="@color/jc_nav_tint"\n        app:itemTextColor="@color/jc_nav_tint"\n        app:itemActiveIndicatorStyle="@style/JcNavIndicator"\n        app:labelVisibilityMode="labeled" />', 1))

          # 20. boutons Historique / Telechargements : texte et icone en blanc
          edit("app/src/main/res/layout/fragment_library.xml", lambda s: s.replace(
              'android:id="@+id/watch_history"',
              'android:id="@+id/watch_history"\n                        android:textColor="#FFFFFF"\n                        app:iconTint="#FFFFFF"', 1).replace(
              'android:id="@+id/downloads"',
              'android:id="@+id/downloads"\n                        android:textColor="#FFFFFF"\n                        app:iconTint="#FFFFFF"', 1))

          # 21. plein ecran automatique a la rotation du telephone (comme YouTube)
          # force a true (ignore toute valeur "false" deja enregistree sur l'appareil)
          edit("app/src/main/java/com/github/libretube/helpers/PlayerHelper.kt", lambda s: s.replace(
              "    val autoFullscreenEnabled: Boolean\n        get() = PreferenceHelper.getBoolean(\n            PreferenceKeys.AUTO_FULLSCREEN,\n            false\n        )",
              "    val autoFullscreenEnabled: Boolean\n        get() = true", 1))
          edit("app/src/main/res/xml/player_settings.xml", lambda s: s.replace(
              'app:defaultValue="false"\n            app:key="auto_fullscreen"',
              'app:defaultValue="true"\n            app:key="auto_fullscreen"', 1))

          # 22. engrenage parametres visible en haut (au lieu des 3 points)
          edit("app/src/main/res/menu/action_bar.xml", lambda s: s.replace(
              '    <item\n        android:id="@+id/action_settings"\n        android:title="@string/settings"\n        app:showAsAction="never" />',
              '    <item\n        android:id="@+id/action_settings"\n        android:icon="@drawable/ic_settings"\n        android:title="@string/settings"\n        app:showAsAction="always" />', 1))
          edit("app/src/main/java/com/github/libretube/ui/activities/MainActivity.kt", lambda s: s.replace(
              '        menu.add(Menu.NONE, Menu.NONE, 999, "Mon abonnement").setOnMenuItemClickListener {\n            com.github.libretube.jc.LicenseManager.showInfo(this)\n            true\n        }',
              '        menu.findItem(R.id.action_help)?.isVisible = false\n        menu.findItem(R.id.action_donate)?.isVisible = false\n        menu.findItem(R.id.action_about)?.isVisible = false\n        menu.add(Menu.NONE, Menu.NONE, 999, "Mon abonnement").apply {\n            setIcon(R.drawable.ic_badge)\n            setShowAsAction(android.view.MenuItem.SHOW_AS_ACTION_ALWAYS)\n        }.setOnMenuItemClickListener {\n            com.github.libretube.jc.LicenseManager.showInfo(this)\n            true\n        }', 1))

          # 23. ecran de demarrage (splash) : triangle rouge DarkTube sur fond noir
          (res / "drawable").mkdir(parents=True, exist_ok=True)
          (res / "drawable/splash_icon.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<vector xmlns:android="http://schemas.android.com/apk/res/android"\n'
              '    android:width="64dp"\n'
              '    android:height="64dp"\n'
              '    android:viewportWidth="1280"\n'
              '    android:viewportHeight="1280">\n'
              '    <group\n'
              '        android:name="scaleGroup"\n'
              '        android:scaleX="0.5"\n'
              '        android:scaleY="0.5"\n'
              '        android:pivotX="640"\n'
              '        android:pivotY="640">\n'
              '        <path\n'
              '            android:fillColor="#EB1419"\n'
              '            android:strokeColor="#EB1419"\n'
              '            android:strokeWidth="70"\n'
              '            android:strokeLineJoin="round"\n'
              '            android:pathData="M520,400 L520,880 L920,640 Z" />\n'
              '    </group>\n'
              '</vector>\n', encoding="utf-8")
          edit("app/src/main/res/values/themes.xml", lambda s: s.replace(
              '<item name="windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>',
              '<item name="windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>\n        <item name="windowSplashScreenBackground">#000000</item>', 1))

          # 24. spinners de chargement en rouge (tous les LoadingIndicator via le style du theme)
          # le style JcLoadingIndicator est defini ici (values) et reference aussi par le theme sombre (values-night)
          edit("app/src/main/res/values/themes.xml", lambda s: s.replace(
              '<item name="loadingIndicatorStyle">@style/Widget.Material3.LoadingIndicator.Contained</item>',
              '<item name="loadingIndicatorStyle">@style/JcLoadingIndicator</item>', 1).replace(
              '</resources>',
              '    <style name="JcLoadingIndicator" parent="Widget.Material3.LoadingIndicator.Contained">\n        <item name="indicatorColor">#EB1419</item>\n        <item name="containerColor">@android:color/transparent</item>\n    </style>\n</resources>', 1))
          edit("app/src/main/res/values-night/themes.xml", lambda s: s.replace(
              '<item name="loadingIndicatorStyle">@style/Widget.Material3.LoadingIndicator.Contained</item>',
              '<item name="loadingIndicatorStyle">@style/JcLoadingIndicator</item>', 1))

          # 25. style du loader : rond classique qui tourne (CircularProgressIndicator) en rouge
          import glob as _glob
          for _lf in _glob.glob("app/src/main/res/layout/*.xml"):
              _t = open(_lf, encoding="utf-8").read()
              if "com.google.android.material.loadingindicator.LoadingIndicator" in _t:
                  open(_lf, "w", encoding="utf-8").write(_t.replace(
                      "com.google.android.material.loadingindicator.LoadingIndicator",
                      "com.google.android.material.progressindicator.CircularProgressIndicator"))
          edit("app/src/main/res/values/themes.xml", lambda s: s.replace(
              '</resources>',
              '    <style name="JcSpinner" parent="Widget.Material3.CircularProgressIndicator">\n        <item name="android:indeterminate">true</item>\n        <item name="indicatorColor">#EB1419</item>\n        <item name="trackThickness">4dp</item>\n    </style>\n</resources>', 1))
          for _tf in ("app/src/main/res/values/themes.xml", "app/src/main/res/values-night/themes.xml"):
              _tt = open(_tf, encoding="utf-8").read()
              assert '<item name="loadingIndicatorStyle">@style/JcLoadingIndicator</item>' in _tt, _tf
              open(_tf, "w", encoding="utf-8").write(_tt.replace(
                  '<item name="loadingIndicatorStyle">@style/JcLoadingIndicator</item>',
                  '<item name="loadingIndicatorStyle">@style/JcLoadingIndicator</item>\n        <item name="circularProgressIndicatorStyle">@style/JcSpinner</item>', 1))

          # 26. correctif : lecteur parfois coince en mini au lancement
          # transitionToStart() lance avant la mesure de la vue -> differer d'une frame
          edit("app/src/main/java/com/github/libretube/ui/fragments/PlayerFragment.kt", lambda s: s.replace(
              "        binding.playerMotionLayout.progress = 1F\n        binding.playerMotionLayout.transitionToStart()",
              "        binding.playerMotionLayout.progress = 1F\n        binding.playerMotionLayout.post { binding.playerMotionLayout.transitionToStart() }", 1))

          print("customization done")
          PY

      - name: Prepare signing key
        env:
          JC_KEYSTORE: ${{ secrets.JC_KEYSTORE }}
        run: |
          if [ -z "$JC_KEYSTORE" ]; then
            echo "::error::Le secret JC_KEYSTORE est absent (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$JC_KEYSTORE" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/tubeplus.keystore"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/tubeplus.keystore
          storePassword=tubeplus-jc-2026
          keyAlias=tubeplus
          keyPassword=tubeplus-jc-2026
          EOF

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Collect APK
        run: |
          ls -la app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk tubeplus.apk
          echo "${{ github.run_number }}" > version.txt

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: tubeplus
          path: tubeplus.apk

      # Publishes the APK at a fixed address:
      # https://github.com/<owner>/<repo>/releases/latest/download/tubeplus.apk
      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          sleep 5
          gh release create latest tubeplus.apk version.txt \
            --title "DarkTube - version ${{ github.run_number }}" \
            --notes "Version ${{ github.run_number }}" \
            --target "${{ github.sha }}" \
            --latest
